# What should be written in the deployed VM as the nginx configuration

server {
    listen 80;
    server_name yourservername.com;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS 
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name yourservername.com;

    ssl_certificate     /etc/letsencrypt/live/yourservername.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourservername.com/privkey.pem;
    ss_protocols        /TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarder_for;
        proxy_set_header X-Forwarder-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
    }
}