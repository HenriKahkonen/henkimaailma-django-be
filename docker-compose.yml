services:
  henkimaailma_db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - henkimaailma_db
    env_file: .env
    environment:
      - DB_HOST=henkimaailma_db
    ports:
      - "8000:8000"
    volumes:
      - static_volume:/app/staticfiles
    networks:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "8080:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
    networks:
      - backend

volumes:
  pgdata:
  static_volume:

networks:
  backend: